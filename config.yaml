# DRC client registry. Each key under clients: is a selectable workspace after login.
# Copy the fnwl: block to add another client (change name, Rally/ZDR scope, and create_defaults).
# alm_kind currently supports: rally
#
clients:
  fnwl:
    enabled: true
    name: FNWL
    full_name: Farmers New World Life
    alm_name: Rally
    alm_kind: rally
    rally:
      base_url: https://rally1.rallydev.com
      project: 'IT: Testing'
      not_state: Closed
      owners:
      - Mohamed Dhapan Asadullaha.n
      - Paras Sharma
      - Suraj Manandhar
      - Mohit Tiwari
      - Manish Sahu
      - Anand Babu K
      - Niraj Khisty
      filter_url: https://rally1.rallydev.com/#/730865758999d/defects?view=43b15f7f-a99b-4375-a16d-c5610103dc82
      state_values:
      - Submitted
      - Open
      - In Progress
      - Fixed
      - Failed
      - Closed
      on_zdr_created:
        comment_template: '{zdr_key} has been created for Zinnia analysis.'
        state: In Progress
        schedule_state: In-Progress
    zdr:
      site: zinnia.atlassian.net
      project_key: ZDR
      issue_type_id: '11266'
      external_id_field: customfield_13901
      qa_complete_date_field: customfield_15254
      jql_scope: >-
        "Defect Reporting Project Farmers[Dropdown]" = "Farmers Product Launches 2025 OA7540"
        AND "External Issue ID A[Short text]" ~ "DE*"
      jql_excluded_statuses:
      - Done
      - Canceled
      - Cancelled
      - Pending Client Info
      - Pending Client Sign Off
      - PENDING APPROVAL TO CLOSE
      jql_order_by: cf[13508] ASC
      matching_excluded_statuses:
      - Done
      - Canceled
      - Cancelled
      filter_url: https://zinnia.atlassian.net/issues/?jql=project%20%3D%20ZDR%20AND%20%22Defect%20Reporting%20Project%20Farmers%5BDropdown%5D%22%20%3D%20%22Farmers%20Product%20Launches%202025%20OA7540%22%20AND%20%22External%20Issue%20ID%20A%5BShort%20text%5D%22%20~%20%22DE%2A%22%20AND%20status%20not%20in%20%28Done%2C%20Canceled%2C%20Cancelled%2C%20%22Pending%20Client%20Info%22%2C%20%22Pending%20Client%20Sign%20Off%22%2C%20%22PENDING%20APPROVAL%20TO%20CLOSE%22%29%20ORDER%20BY%20cf%5B13508%5D%20ASC
      create_defaults:
        client_field: customfield_15215
        client_option_id: '24684'
        organization_field: customfield_12200
        organization_id: 319
        request_type_field: customfield_15205
        request_type_id: '1320'
        farmers_project_field: customfield_17839
        farmers_project_option_id: '25214'
        classification_field: customfield_18140
        classification_option_id: '25393'
        severity_field: customfield_18664
        severity_options:
          Showstopper: '26697'
          Critical: '26698'
          High: '26699'
          Medium: '26700'
          Low: '26701'
        environment_field: customfield_14502
        environment_options:
          Development: '14003'
          Production: '14007'
          Test - QA1: '14004'
          Test - QA2: '19743'
          Regression: '14008'
    matching:
      rally_id_prefix: ''
    sync_check:
      rally_statuses_requiring_zdr_progress:
      - Open
      - Failed
      zdr_blocking_statuses:
      - Pending Client Info
      - Pending Approval to Close
      - Cancelled
    comment_sync:
      tag_line: 'Latest Comments from Rally Posted at:'
      other_team: FNWL Team
  evgl:
    enabled: true
    name: EVGL
    full_name: Demo client
    alm_name: ABC
    alm_kind: abc
